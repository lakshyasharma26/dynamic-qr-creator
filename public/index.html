<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic QR Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <div class="max-w-5xl mx-auto px-4 py-10">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6 mb-8">
      <div>
        <h1 class="text-3xl font-bold text-indigo-400">Dynamic QR Studio</h1>
        <p class="text-slate-400 text-sm mt-1">Custom colors ke saath Dynamic QR banayein, link kabhi bhi badlein aur live scans track karein.</p>
      </div>
    </div>

    <!-- Create QR Form -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-10 shadow-lg">
      <h2 class="text-lg font-semibold mb-4 text-white">Naya Dynamic QR Banayein</h2>
      <form id="createForm" class="grid grid-cols-1 md:grid-cols-6 gap-4">
        <div class="md:col-span-2">
          <label class="block text-xs text-slate-400 mb-1">QR Title / Naam *</label>
          <input type="text" id="title" required placeholder="e.g. Product Packaging"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs text-slate-400 mb-1">Destination URL *</label>
          <input type="text" id="target_url" required placeholder="https://example.com"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs text-slate-400 mb-1">Custom Short ID (Optional)</label>
          <input type="text" id="custom_slug" placeholder="e.g. offer-2026"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>

        <!-- Color Pickers -->
        <div class="md:col-span-2">
          <label class="block text-xs text-slate-400 mb-1">QR Dots Color (Foreground)</label>
          <div class="flex items-center gap-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5">
            <input type="color" id="fg_color" value="#000000" class="w-7 h-7 bg-transparent border-0 cursor-pointer" />
            <span id="fg_label" class="text-xs font-mono text-slate-300">#000000</span>
          </div>
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs text-slate-400 mb-1">Background Color</label>
          <div class="flex items-center gap-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5">
            <input type="color" id="bg_color" value="#ffffff" class="w-7 h-7 bg-transparent border-0 cursor-pointer" />
            <span id="bg_label" class="text-xs font-mono text-slate-300">#ffffff</span>
          </div>
        </div>
        <div class="md:col-span-2 flex items-end">
          <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-lg text-sm transition cursor-pointer">
            + Generate Dynamic QR
          </button>
        </div>
      </form>
    </div>

    <!-- QR List -->
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-semibold">Aapke Active QR Codes</h2>
      <button onclick="loadQRs()" class="text-xs text-indigo-400 hover:underline cursor-pointer">↻ Refresh Stats</button>
    </div>

    <div id="qrList" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="hidden fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6">
      <h3 class="text-lg font-bold mb-4">QR Update Karein</h3>
      <input type="hidden" id="editId" />
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Title</label>
          <input type="text" id="editTitle"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Naya Target URL</label>
          <input type="text" id="editUrl"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">QR Color</label>
            <input type="color" id="editFg" class="w-full h-9 bg-slate-800 border border-slate-700 rounded-lg p-1 cursor-pointer" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Background Color</label>
            <input type="color" id="editBg" class="w-full h-9 bg-slate-800 border border-slate-700 rounded-lg p-1 cursor-pointer" />
          </div>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button onclick="closeModal()" class="px-4 py-2 text-sm text-slate-400 hover:text-white cursor-pointer">Cancel</button>
          <button onclick="saveEdit()" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2 rounded-lg text-sm font-medium cursor-pointer">
            Save Changes
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('fg_color').addEventListener('input', (e) => {
      document.getElementById('fg_label').textContent = e.target.value;
    });
    document.getElementById('bg_color').addEventListener('input', (e) => {
      document.getElementById('bg_label').textContent = e.target.value;
    });

    async function loadQRs() {
      const res = await fetch('/api/qrs');
      const data = await res.json();
      const container = document.getElementById('qrList');

      if (data.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-sm col-span-2">Abhi tak koi QR code nahi bana hai.</p>`;
        return;
      }

      container.innerHTML = data.map(qr => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex gap-5 items-center">
          <div class="p-2 rounded-xl shrink-0 border border-slate-700" style="background-color: ${qr.bg_color || '#ffffff'}">
            <img src="${qr.qrImage}" alt="QR" class="w-28 h-28" />
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2">
              <h3 class="font-bold text-lg text-white truncate">${qr.title}</h3>
              <span class="bg-indigo-500/20 text-indigo-300 text-xs font-semibold px-2.5 py-1 rounded-full shrink-0">
                ${qr.scans} Scans
              </span>
            </div>

            <p class="text-xs text-slate-400 mt-1 truncate">
              <span class="text-slate-500">Static QR Link:</span>
              <a href="${qr.dynamicUrl}" target="_blank" class="text-indigo-400 hover:underline">${qr.dynamicUrl}</a>
            </p>

            <p class="text-xs text-emerald-400 mt-1 truncate">
              <span class="text-slate-500">Redirects to:</span> ${qr.target_url}
            </p>

            <div class="flex flex-wrap gap-2 mt-4">
              <a href="${qr.qrImage}" download="${qr.slug}-qr.png"
                class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg transition">
                ⬇ Download PNG
              </a>
              <button onclick="openEdit(${qr.id}, '${qr.title.replace(/'/g, "\'")}', '${qr.target_url}', '${qr.fg_color || '#000000'}', '${qr.bg_color || '#ffffff'}')"
                class="bg-amber-600/20 text-amber-300 hover:bg-amber-600/30 text-xs px-3 py-1.5 rounded-lg transition cursor-pointer">
                ✎ Edit
              </button>
              <button onclick="deleteQR(${qr.id})"
                class="bg-rose-600/20 text-rose-400 hover:bg-rose-600/30 text-xs px-3 py-1.5 rounded-lg transition cursor-pointer">
                🗑 Delete
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const target_url = document.getElementById('target_url').value;
      const custom_slug = document.getElementById('custom_slug').value;
      const fg_color = document.getElementById('fg_color').value;
      const bg_color = document.getElementById('bg_color').value;

      const res = await fetch('/api/qrs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, target_url, custom_slug, fg_color, bg_color })
      });

      const result = await res.json();
      if (!res.ok) return alert(result.error);

      e.target.reset();
      document.getElementById('fg_color').value = '#000000';
      document.getElementById('bg_color').value = '#ffffff';
      document.getElementById('fg_label').textContent = '#000000';
      document.getElementById('bg_label').textContent = '#ffffff';
      loadQRs();
    });

    function openEdit(id, title, url, fg, bg) {
      document.getElementById('editId').value = id;
      document.getElementById('editTitle').value = title;
      document.getElementById('editUrl').value = url;
      document.getElementById('editFg').value = fg;
      document.getElementById('editBg').value = bg;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function saveEdit() {
      const id = document.getElementById('editId').value;
      const title = document.getElementById('editTitle').value;
      const target_url = document.getElementById('editUrl').value;
      const fg_color = document.getElementById('editFg').value;
      const bg_color = document.getElementById('editBg').value;

      await fetch(`/api/qrs/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, target_url, fg_color, bg_color })
      });

      closeModal();
      loadQRs();
    }

    async function deleteQR(id) {
      if (!confirm('Kya aap sach mein is QR code ko delete karna chahte hain?')) return;
      await fetch(`/api/qrs/${id}`, { method: 'DELETE' });
      loadQRs();
    }

    loadQRs();
  </script>
</body>
</html>
